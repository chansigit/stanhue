[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stanhue"
version = "1.1.1"
description = "Hierarchical auto-coloring for scatter plots with categorical labels"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Sijie Chen"}]
keywords = ["single-cell", "UMAP", "scatter-plot", "color-palette", "visualization", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: R",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
]

[project.urls]
Homepage = "https://github.com/chansigit/stanhue"
Repository = "https://github.com/chansigit/stanhue"
Issues = "https://github.com/chansigit/stanhue/issues"
Changelog = "https://github.com/chansigit/stanhue/releases"

[project.optional-dependencies]
plot = ["matplotlib>=3.5", "scanpy>=1.9"]

[tool.hatch.build.targets.wheel]
packages = ["stanhue"]

[tool.hatch.build.targets.sdist]
only-include = ["stanhue", "scatter_colormap.R", "README.md", "LICENSE", "pyproject.toml"]
